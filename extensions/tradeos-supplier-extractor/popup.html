<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 420px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #1a1a1a;
      }
      .container {
        padding: 16px;
      }
      h2 {
        font-size: 16px;
        margin-bottom: 12px;
        color: #111;
      }
      h3 {
        font-size: 14px;
        margin: 12px 0 8px;
        color: #333;
      }
      .status {
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .status.ok {
        background: #e6f7e6;
        color: #1a7d1a;
      }
      .status.err {
        background: #ffe6e6;
        color: #cc0000;
      }
      .status.waiting {
        background: #fff3e0;
        color: #e65100;
      }
      .status.info {
        background: #e3f2fd;
        color: #0d47a1;
      }
      .field {
        margin-bottom: 6px;
      }
      .field label {
        font-weight: 600;
        color: #666;
        display: block;
        font-size: 11px;
        text-transform: uppercase;
      }
      .field .value {
        color: #1a1a1a;
        word-break: break-word;
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-block {
        display: block;
        width: 100%;
        text-align: center;
      }
      .btn.primary {
        background: #0066cc;
        color: white;
      }
      .btn.primary:hover {
        background: #0052a3;
      }
      .btn.primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .btn.secondary {
        background: #f0f0f0;
        color: #333;
      }
      .btn.secondary:hover {
        background: #e0e0e0;
      }
      .btn.danger {
        background: #d32f2f;
        color: white;
      }
      .btn.danger:hover {
        background: #b71c1c;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btn-group .btn {
        flex: 1;
      }
      .supplier-item {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        position: relative;
      }
      .supplier-item .name {
        font-weight: 600;
        font-size: 13px;
      }
      .supplier-item .meta {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }
      .supplier-item .remove {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #999;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      .supplier-item .remove:hover {
        color: #d32f2f;
      }
      .supplier-item .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 600;
        margin-right: 4px;
      }
      .badge-ok {
        background: #e6f7e6;
        color: #1a7d1a;
      }
      .badge-err {
        background: #ffe6e6;
        color: #cc0000;
      }
      .badge-info {
        background: #e3f2fd;
        color: #0d47a1;
      }
      .analysis-box {
        background: #f5f5f5;
        border-radius: 6px;
        padding: 10px;
        margin-top: 8px;
        max-height: 250px;
        overflow-y: auto;
      }
      .analysis-box pre {
        font-size: 11px;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .risk-high {
        color: #d32f2f;
        font-weight: 700;
      }
      .risk-medium {
        color: #e65100;
        font-weight: 600;
      }
      .risk-low {
        color: #2e7d32;
        font-weight: 600;
      }
      .cost-row {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
        font-size: 12px;
      }
      .cost-row.total {
        font-weight: 700;
        border-top: 1px solid #ddd;
        margin-top: 4px;
        padding-top: 4px;
      }
      .empty-state {
        text-align: center;
        padding: 24px 16px;
        color: #999;
      }
      .empty-state p {
        margin-top: 8px;
      }
      .tab-bar {
        display: flex;
        border-bottom: 2px solid #e0e0e0;
        margin-bottom: 12px;
      }
      .tab {
        padding: 8px 16px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #666;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
      }
      .tab.active {
        color: #0066cc;
        border-bottom-color: #0066cc;
      }
      .spinner {
        text-align: center;
        padding: 16px;
        color: #666;
        font-size: 12px;
      }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        color: #999;
        text-align: center;
        border-top: 1px solid #eee;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>TradeOS Procurement</h2>
      <div id="status" class="status info">
        Navigate to a supplier page to extract data
      </div>

      <div class="tab-bar">
        <div class="tab active" data-tab="extract">Extract</div>
        <div class="tab" data-tab="collection">
          Collection (<span id="collectionCount">0</span>)
        </div>
        <div class="tab" data-tab="compare">Compare</div>
      </div>

      <!-- Extract Tab -->
      <div id="tabExtract">
        <div id="extracted" style="display: none">
          <div class="field">
            <label>Product</label>
            <div id="productName" class="value"></div>
          </div>
          <div class="field">
            <label>Supplier</label>
            <div id="supplierName" class="value"></div>
          </div>
          <div class="field">
            <label>Price</label>
            <div id="priceRaw" class="value"></div>
          </div>
          <div class="field">
            <label>Platform</label>
            <div id="platform" class="value"></div>
          </div>
          <div class="btn-group">
            <button id="addToCollection" class="btn primary">
              + Add to Collection
            </button>
            <button id="analyzeBtn" class="btn secondary">Analyze Only</button>
          </div>
        </div>
        <div id="lastAnalysis" style="display: none; margin-top: 8px"></div>
      </div>

      <!-- Collection Tab -->
      <div id="tabCollection" style="display: none">
        <div id="collectionList"></div>
        <div class="btn-group" id="collectionActions" style="display: none">
          <button id="compareAll" class="btn primary">Compare All</button>
          <button id="clearCollection" class="btn danger">Clear All</button>
        </div>
      </div>

      <!-- Compare Tab -->
      <div id="tabCompare" style="display: none">
        <div id="comparisonResult"></div>
      </div>

      <div id="spinner" class="spinner" style="display: none">Loading...</div>
      <div class="footer">TradeOS v0.1 — evidence-backed procurement</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
